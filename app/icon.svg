<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="110" fill="#0A0F0D"/>
  <rect x="16" y="16" width="480" height="480" rx="94" stroke="#4B6F44" stroke-width="12" stroke-opacity="0.6"/>
  
  <!-- Outer Tactical Radar Ring -->
  <circle cx="256" cy="256" r="190" stroke="#6B8E23" stroke-width="6" stroke-dasharray="28 18" stroke-opacity="0.5"/>
  <circle cx="256" cy="256" r="140" stroke="#2A9D8F" stroke-width="4" stroke-opacity="0.4"/>
  
  <!-- Tactical Crosshair Grid -->
  <line x1="256" y1="40" x2="256" y2="472" stroke="#4B6F44" stroke-width="4" stroke-opacity="0.35"/>
  <line x1="40" y1="256" x2="472" y2="256" stroke="#4B6F44" stroke-width="4" stroke-opacity="0.35"/>
  
  <!-- Isometric Cargo Container / Supply Box -->
  <!-- Top Face -->
  <polygon points="256,130 360,185 256,240 152,185" fill="#3A5A35" stroke="#6B8E23" stroke-width="8" stroke-linejoin="round"/>
  <!-- Left Face -->
  <polygon points="152,185 256,240 256,365 152,310" fill="#1E2E1B" stroke="#4B6F44" stroke-width="8" stroke-linejoin="round"/>
  <!-- Right Face -->
  <polygon points="256,240 360,185 360,310 256,365" fill="#294025" stroke="#4B6F44" stroke-width="8" stroke-linejoin="round"/>
  
  <!-- Tactical Container Ribs / Straps -->
  <line x1="204" y1="213" x2="204" y2="338" stroke="#6B8E23" stroke-width="6" stroke-opacity="0.6"/>
  <line x1="308" y1="213" x2="308" y2="338" stroke="#6B8E23" stroke-width="6" stroke-opacity="0.6"/>

  <!-- Center Tactical GPS Tracking Beacon -->
  <circle cx="256" cy="240" r="16" fill="#10B981"/>
  <circle cx="256" cy="240" r="30" stroke="#10B981" stroke-width="4" stroke-opacity="0.6"/>
  <circle cx="256" cy="240" r="44" stroke="#10B981" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Forward Supply Arrow -->
  <path d="M256 80 L276 110 L256 102 L236 110 Z" fill="#10B981"/>
</svg>
